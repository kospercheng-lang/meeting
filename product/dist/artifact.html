<title>Gate-to-Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
/* Layout: one app, three roles. Sticky top bar (brand, role-aware nav, role switch); one reading column below. The case track with its two gate diamonds is the recurring signature. */
:root {
  --bg: #f4f3ee; --surface: #fffffc; --surface-2: #ecebe4; --ink: #14233a; --ink-2: #4a5568; --muted: #737985;
  --line: #d9d5c9; --accent: #b5651d; --gate: #d9822b; --gate-soft: #f6e3cf; --navy: #14233a; --navy-ink: #f4f3ee; --navy-ink-2: #bfc8d6;
  --good: #1f7a3a; --good-soft: #dcefe1; --warn: #8a5a00; --warn-soft: #f8ebcc; --bad: #b3261e; --bad-soft: #f7dcd9;
  --bar: #2a78d6;
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --display: "Noto Serif TC", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141c; --surface: #18202b; --surface-2: #212a37; --ink: #eef0f3; --ink-2: #b9c0cb; --muted: #8b93a0;
    --line: #2e3947; --accent: #e9a35a; --gate: #d9822b; --gate-soft: #3a2a19; --navy: #0a0e14; --navy-ink: #eef0f3; --navy-ink-2: #aeb7c4;
    --good: #6fcf8a; --good-soft: #17301f; --warn: #e8b84a; --warn-soft: #33290f; --bad: #f08a80; --bad-soft: #3a1b18;
    --bar: #3987e5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141c; --surface: #18202b; --surface-2: #212a37; --ink: #eef0f3; --ink-2: #b9c0cb; --muted: #8b93a0;
  --line: #2e3947; --accent: #e9a35a; --gate: #d9822b; --gate-soft: #3a2a19; --navy: #0a0e14; --navy-ink: #eef0f3; --navy-ink-2: #aeb7c4;
  --good: #6fcf8a; --good-soft: #17301f; --warn: #e8b84a; --warn-soft: #33290f; --bad: #f08a80; --bad-soft: #3a1b18;
  --bar: #3987e5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.7; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; }
@media (min-width: 760px) { .wrap { padding-inline: 32px; } }
h1, h2, h3 { text-wrap: balance; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--gate); outline-offset: 2px; }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--navy); color: var(--navy-ink); }
.topbar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 10px; }
.brand { background: none; border: 0; color: var(--navy-ink); cursor: pointer; padding: 0; text-align: left; }
.brand b { font-family: var(--display); font-size: 19px; display: block; line-height: 1.2; }
.brand small { font-size: 11px; letter-spacing: .12em; color: #e9a35a; }
.nav { display: flex; gap: 2px; overflow-x: auto; flex: 1 1 auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav button { background: none; border: 0; color: var(--navy-ink-2); padding: 6px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; font-size: 14px; }
.nav button:hover { color: var(--navy-ink); background: rgba(255,255,255,.06); }
.nav button[aria-current="page"] { color: var(--navy-ink); background: rgba(217,130,43,.22); }
.role { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--navy-ink-2); flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid rgba(255,255,255,.2); border-radius: 8px; overflow: hidden; }
.seg button { background: none; border: 0; color: var(--navy-ink-2); padding: 4px 10px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--gate); color: #14233a; font-weight: 700; }
.role select { font: inherit; font-size: 13px; background: rgba(255,255,255,.08); color: var(--navy-ink); border: 1px solid rgba(255,255,255,.2); border-radius: 6px; padding: 3px 6px; max-width: 220px; }
.role select option { color: #14233a; }
.modebar { font-size: 12px; padding-block: 6px; background: var(--warn-soft); color: var(--warn); }
.modebar.shared { background: var(--surface-2); color: var(--ink-2); }

main { padding-block: 28px 72px; }
.view { display: flex; flex-direction: column; gap: 20px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.page-head h1 { font-family: var(--display); font-size: clamp(24px, 3.6vw, 32px); line-height: 1.3; margin: 0; }
.eyebrow { font-size: 12px; letter-spacing: .14em; color: var(--accent); font-weight: 700; margin: 0 0 4px; }
.lead { color: var(--ink-2); max-width: 66ch; margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; min-width: 0; }
.card > h2, .card > .card-head h2 { font-size: 17px; margin: 0; }
.card .sub { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }
.card-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grid3 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.btn { border-radius: 8px; padding: 7px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 500; font-size: 14px; white-space: nowrap; }
.btn.primary { background: var(--gate); border-color: var(--gate); color: #14233a; }
.btn.ghost { background: transparent; }
.btn.small { padding: 3px 10px; font-size: 13px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.accent { background: var(--gate-soft); color: var(--accent); }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.callout { background: var(--gate-soft); border-radius: 10px; padding: 12px 14px; font-size: 14px; margin: 0; }
.empty { text-align: center; color: var(--ink-2); padding: 32px 16px; }
.empty h2 { font-family: var(--display); color: var(--ink); font-size: 22px; margin: 0 0 8px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink-2); font-weight: 500; }
input[type=text], input[type=email], input[type=date], input[type=number], select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%; }
textarea { min-height: 64px; resize: vertical; }
.form { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.form .wide { grid-column: 1 / -1; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--surface-2); }
.muted { color: var(--muted); font-size: 13px; }

/* hero */
.hero { background: var(--navy); color: var(--navy-ink); border-radius: 16px; padding: 36px 28px; }
.hero h1 { font-family: var(--display); font-size: clamp(28px, 5vw, 46px); line-height: 1.25; margin: 6px 0 14px; }
.hero p { color: var(--navy-ink-2); max-width: 60ch; margin: 0 0 20px; font-size: 16px; }
.hero .eyebrow { color: #e9a35a; }
.mistake { border-top: 3px solid var(--gate); padding-top: 12px; }
.mistake h3 { margin: 0 0 4px; font-size: 16px; }
.mistake p { margin: 0; color: var(--ink-2); font-size: 14px; }

/* case track */
.track-scroll { overflow-x: auto; }
.track { display: grid; grid-template-columns: repeat(2, 1fr) 36px repeat(2, 1fr) 36px repeat(4, 1fr); gap: 4px; min-width: 760px; }
.tk { min-height: 40px; padding: 6px 4px; border-radius: 6px; background: var(--surface-2); color: var(--muted); font-size: 12px; line-height: 1.25; display: flex; align-items: center; justify-content: center; text-align: center; }
.tk.done { background: var(--good-soft); color: var(--good); }
.tk.now { background: var(--gate); color: #14233a; font-weight: 700; }
.gd { display: flex; align-items: center; justify-content: center; }
.gd i { width: 16px; height: 16px; transform: rotate(45deg); border: 2px solid var(--gate); border-radius: 2px; }
.gd.pass i { background: var(--gate); }
.gd.stop i { background: var(--bad); border-color: var(--bad); }
.case-hero { display: flex; flex-direction: column; gap: 12px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.tab { border: 0; background: none; color: var(--ink-2); padding: 10px 12px; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gate); font-weight: 700; }
.tab .n { background: var(--gate); color: #14233a; border-radius: 999px; font-size: 11px; font-weight: 700; padding: 0 7px; line-height: 18px; }
.todo { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.todo:first-of-type { border-top: 0; }
.todo .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--gate); }
.todo.done .dot { background: var(--good); }
.todo div { flex: 1; min-width: 0; }
.todo b { display: block; font-weight: 500; }
.todo span { color: var(--muted); font-size: 13px; }
.gate-row { display: grid; grid-template-columns: 56px 1fr; gap: 6px 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.gate-row:first-of-type { border-top: 0; }
.gate-code { font-weight: 700; color: var(--accent); }
.gate-inputs { grid-column: 2; display: grid; grid-template-columns: 150px 1fr; gap: 8px; }
@media (max-width: 640px) { .gate-row { grid-template-columns: 1fr; } .gate-inputs { grid-column: 1; grid-template-columns: 1fr; } }
.verdict { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; background: var(--surface-2); border-radius: 10px; padding: 14px; }
.q { padding: 12px 0; border-top: 1px solid var(--line); }
.q:first-of-type { border-top: 0; }
.q p { margin: 0 0 8px; font-weight: 500; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: 14px; background: var(--surface); }
.opt input { accent-color: var(--gate); }
.opt:has(input:checked) { border-color: var(--gate); background: var(--gate-soft); }
.meter { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--gate); border-radius: 0 5px 5px 0; }
.meter.over i { background: var(--bad); }
.result { border-radius: 12px; padding: 16px 18px; border: 2px solid var(--line); background: var(--surface); }
.result.good { border-color: var(--good); } .result.warn { border-color: var(--warn); } .result.bad { border-color: var(--bad); }
.result h3 { margin: 0 0 6px; }
.scn { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.scn h3 { margin: 0; font-size: 15px; }
.scn p { margin: 0; font-size: 13px; color: var(--ink-2); }
dl.memo { display: grid; grid-template-columns: 170px 1fr; gap: 8px 20px; margin: 0; }
dl.memo dt { color: var(--muted); font-size: 13px; font-weight: 500; }
dl.memo dd { margin: 0; white-space: pre-wrap; }
@media (max-width: 600px) { dl.memo { grid-template-columns: 1fr; gap: 2px; } dl.memo dd { margin-bottom: 8px; } }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 4px 0; }
.check input { margin-top: 6px; accent-color: var(--gate); width: 16px; height: 16px; flex: none; }
.entry { display: grid; grid-template-columns: 100px 1fr; gap: 2px 16px; padding: 12px 0; border-top: 1px solid var(--line); }
.entry:first-of-type { border-top: 0; }
.entry time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.entry h3 { margin: 0; font-size: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.entry p { margin: 4px 0 0; color: var(--ink-2); font-size: 14px; white-space: pre-wrap; }
@media (max-width: 600px) { .entry { grid-template-columns: 1fr; } }
/* intel */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tag { background: var(--surface-2); border-radius: 6px; padding: 2px 8px; font-size: 13px; }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.kpi b { display: block; font-size: 26px; line-height: 1.2; }
.kpi span { font-size: 13px; color: var(--muted); }
.bars { display: grid; grid-template-columns: 72px 1fr 44px; gap: 6px 10px; align-items: center; font-size: 13px; }
.bars .b { height: 12px; background: var(--surface-2); border-radius: 0 4px 4px 0; }
.bars .b i { display: block; height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; }
.bars .v { text-align: right; font-variant-numeric: tabular-nums; }
.lv3 { color: var(--good); } .lv2 { color: var(--warn); } .lv1 { color: var(--bad); }
.pkg { display: flex; flex-direction: column; gap: 6px; }
.pkg.start { background: var(--navy); color: var(--navy-ink); border-color: var(--navy); }
.pkg.start .sub, .pkg.start p { color: var(--navy-ink-2); }
.pkg h3 { margin: 0; font-size: 19px; }
.pkg p { margin: 0; color: var(--ink-2); font-size: 14px; }
.pkg .price { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); font-weight: 700; }
.pkg.start .price { border-color: rgba(255,255,255,.2); color: var(--navy-ink); }
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); width: min(720px, calc(100vw - 32px)); padding: 20px; }
dialog::backdrop { background: rgba(10,14,20,.5); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 50; max-width: calc(100vw - 32px); }
footer { color: var(--muted); font-size: 12px; padding-block: 0 40px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<header class="topbar">
  <div class="wrap">
    <button class="brand" id="brand" type="button"><small>ISTI｜閘門式 GTM</small><b>Gate-to-Market</b></button>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="role" id="role"></div>
  </div>
</header>
<div class="modebar" id="modebar"><div class="wrap" id="modetext">正在連線…</div></div>
<main><div class="wrap"><div class="view" id="view"></div></div></main>
<footer><div class="wrap">依據《ISTI GTM 策略顧問方法論 v0.98》。品牌名稱暫定；產業情報數值與範例案件為示意資料。價格為待首案校正的假設。</div></footer>
<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>
