<title>Gate-to-Market 客戶專區</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
/* Layout: a client's own case. Top bar names the case; a progress track shows where it is between the two gates; tabs hold what the client must do. */
:root {
  --bg: #f4f3ee; --surface: #fffffc; --surface-2: #ecebe4; --ink: #14233a; --ink-2: #4a5568; --muted: #737985;
  --line: #d9d5c9; --accent: #b5651d; --gate: #d9822b; --gate-soft: #f6e3cf; --top: #14233a; --top-ink: #f4f3ee;
  --good: #1f7a3a; --good-soft: #dcefe1; --warn: #8a5a00; --warn-soft: #f8ebcc; --bad: #b3261e; --bad-soft: #f7dcd9;
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --display: "Noto Serif TC", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141c; --surface: #18202b; --surface-2: #212a37; --ink: #eef0f3; --ink-2: #b9c0cb; --muted: #8b93a0;
    --line: #2e3947; --accent: #e9a35a; --gate: #d9822b; --gate-soft: #3a2a19; --top: #0a0e14; --top-ink: #eef0f3;
    --good: #6fcf8a; --good-soft: #17301f; --warn: #e8b84a; --warn-soft: #33290f; --bad: #f08a80; --bad-soft: #3a1b18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141c; --surface: #18202b; --surface-2: #212a37; --ink: #eef0f3; --ink-2: #b9c0cb; --muted: #8b93a0;
  --line: #2e3947; --accent: #e9a35a; --gate: #d9822b; --gate-soft: #3a2a19; --top: #0a0e14; --top-ink: #eef0f3;
  --good: #6fcf8a; --good-soft: #17301f; --warn: #e8b84a; --warn-soft: #33290f; --bad: #f08a80; --bad-soft: #3a1b18;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.7; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; }
@media (min-width: 760px) { .wrap { padding-inline: 32px; } }
.demo { background: var(--warn-soft); color: var(--warn); font-size: 13px; padding-block: 8px; }
.demo .wrap { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.demo button { font: inherit; font-size: 12px; background: transparent; color: inherit; border: 1px solid currentColor; border-radius: 6px; padding: 2px 10px; cursor: pointer; }
header.top { background: var(--top); color: var(--top-ink); padding-block: 24px 20px; }
.brand { font-size: 12px; letter-spacing: .12em; color: #e9a35a; font-weight: 700; }
header h1 { font-family: var(--display); font-size: clamp(22px, 3.6vw, 30px); margin: 4px 0 2px; line-height: 1.3; text-wrap: balance; }
.who { color: #bfc8d6; font-size: 14px; }
/* progress track */
.track { display: grid; grid-template-columns: repeat(2, 1fr) 40px repeat(2, 1fr) 40px repeat(4, 1fr); gap: 4px; margin-top: 20px; min-width: 760px; align-items: stretch; }
.track-scroll { overflow-x: auto; }
.seg { min-height: 40px; padding-block: 6px; border-radius: 6px; background: rgba(255,255,255,.08); color: #aeb7c4; font-size: 12px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 4px; line-height: 1.2; }
.seg.done { background: rgba(111,207,138,.18); color: #cfeed8; }
.seg.now { background: #d9822b; color: #14233a; font-weight: 700; }
.g { display: flex; align-items: center; justify-content: center; min-height: 40px; }
.g i { width: 18px; height: 18px; transform: rotate(45deg); border: 2px solid #d9822b; border-radius: 2px; }
.g.passed i { background: #d9822b; }
.track-legend { font-size: 12px; color: #aeb7c4; margin-top: 8px; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.tab { border: 0; background: none; font: inherit; color: var(--ink-2); padding: 12px 14px; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gate); font-weight: 700; }
.tab .n { background: var(--gate); color: #14233a; border-radius: 999px; font-size: 11px; font-weight: 700; padding: 0 7px; line-height: 18px; }
main { padding-block: 24px 64px; }
.panel { display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; min-width: 0; }
.card h2 { font-size: 18px; margin: 0 0 4px; }
.card .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.todo { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
.todo:first-of-type { border-top: 0; }
.todo .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--gate); margin-top: 8px; }
.todo.done .dot { background: var(--good); }
.todo b { display: block; }
.todo span { color: var(--muted); font-size: 13px; }
.todo button { margin-left: auto; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.btn { font: inherit; font-size: 14px; border-radius: 8px; padding: 7px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 500; }
.btn.primary { background: var(--gate); border-color: var(--gate); color: #14233a; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .tab:focus-visible, .opt:focus-within { outline: 2px solid var(--gate); outline-offset: 2px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink-2); font-weight: 500; }
input[type=text], input[type=date], input[type=email], select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
textarea { min-height: 64px; resize: vertical; }
.form { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.form .wide { grid-column: 1 / -1; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; }
.saved { font-size: 13px; color: var(--good); }
/* self check */
.q { padding: 14px 0; border-top: 1px solid var(--line); }
.q:first-of-type { border-top: 0; }
.q p { margin: 0 0 8px; font-weight: 500; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
.opt input { accent-color: var(--gate); }
.opt:has(input:checked) { border-color: var(--gate); background: var(--gate-soft); }
.result { border-radius: 12px; padding: 18px 20px; border: 2px solid var(--line); }
.result.good { border-color: var(--good); }
.result.warn { border-color: var(--warn); }
.result.bad { border-color: var(--bad); }
.result h3 { margin: 0 0 6px; }
.meter { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; margin: 8px 0 4px; }
.meter i { display: block; height: 100%; background: var(--gate); border-radius: 0 5px 5px 0; }
/* setup */
dl.memo { display: grid; grid-template-columns: 180px 1fr; gap: 10px 20px; margin: 0; }
dl.memo dt { color: var(--muted); font-size: 13px; font-weight: 500; }
dl.memo dd { margin: 0; }
@media (max-width: 600px) { dl.memo { grid-template-columns: 1fr; gap: 2px; } dl.memo dd { margin-bottom: 10px; } }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
.check input { margin-top: 6px; accent-color: var(--gate); width: 16px; height: 16px; flex: none; }
.callout { background: var(--gate-soft); border-radius: 10px; padding: 12px 14px; font-size: 14px; }
/* tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
td .muted { color: var(--muted); font-size: 13px; }
/* calibration */
.scn { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.scn h3 { margin: 0; font-size: 16px; }
.scn .why { color: var(--ink-2); font-size: 14px; margin: 0; }
.seg3 { display: flex; flex-wrap: wrap; gap: 6px; }
.seg3 label { border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px; font-size: 14px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.seg3 input { accent-color: var(--gate); }
.seg3 label:has(input:checked) { border-color: var(--gate); background: var(--gate-soft); font-weight: 500; }
/* feed */
.entry { display: grid; grid-template-columns: 96px 1fr; gap: 4px 16px; padding: 14px 0; border-top: 1px solid var(--line); }
.entry:first-of-type { border-top: 0; }
.entry time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.entry h3 { margin: 0; font-size: 15px; }
.entry p { margin: 4px 0 0; color: var(--ink-2); font-size: 14px; }
@media (max-width: 600px) { .entry { grid-template-columns: 1fr; } }
.decision { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: start; }
.diamond { width: 40px; height: 40px; transform: rotate(45deg); border-radius: 4px; margin: 10px; background: var(--gate); }
.diamond.wait { background: transparent; border: 2px dashed var(--gate); }
footer { color: var(--muted); font-size: 13px; padding-block: 0 40px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="demo" role="note">
  <div class="wrap"><span>示範版：案件內容為示意資料。你在這頁的操作只存在你自己的瀏覽器裡，不會送出給任何人。</span><button type="button" id="resetDemo">重設示範資料</button></div>
</div>

<header class="top">
  <div class="wrap">
    <div class="brand">GATE-TO-MARKET｜客戶專區</div>
    <h1 id="caseName">冷鏈溫度監測模組 市場決策衝刺</h1>
    <div class="who" id="caseWho">示範企業股份有限公司　·　ISTI 分析師窗口：[分析師姓名]</div>
    <div class="track-scroll"><div class="track" id="track" aria-label="案件進度"></div></div>
    <div class="track-legend">◆ 為閘門：每道閘門都可能做出「不繼續」的結論，條件在開始前就寫好。</div>
  </div>
</header>

<nav class="tabs" role="tablist" id="tabs" aria-label="客戶專區功能"></nav>

<main><div class="wrap"><div class="panel" id="panel"></div></div></main>

<footer><div class="wrap">依據《ISTI GTM 策略顧問方法論 v0.98》。分析師提出市場假設，技術邊界由貴公司技術方確認，市場是否成立由證據決定。</div></footer>

<script>
(function () {
  "use strict";
  var KEY = "gtm-client-portal-v1";
  /* ---------- Example case (illustrative) ---------- */
  var SEED = {
    stageIndex: 1,
    gate1: "Conditional Pass",
    selfCheck: {},
    setupConfirmed: false, setupComment: "", setupChecks: [false, false, false, false],
    contact: { name: "", title: "", email: "", decider: "", deadline: "" },
    interviews: [],
    materials: { spec: "provided", poc: "pending", customers: "pending", winloss: "pending", roadmap: "pending" },
    materialNotes: {},
    calib: {},
    baseline: {},
    read: {}
  };
  var STAGES = [["段 0", "目標確定"], ["段 1", "技術—情境探索"], "G1", ["段 2", "深入洞察"], ["段 3", "機會收斂"], "G2", ["段 4", "價值定義"], ["段 5", "方案與通路"], ["段 6", "商模與成交"], ["段 7", "驗證與擴張"]];
  var SETUP = [
    ["決策問題", "貴公司負責人須在 [日期] 前決定：第一個應用型 MVP 要投入哪一個使用情境。"],
    ["優先產品", "無線溫度感測標籤（示意）"],
    ["範圍內", "感測標籤、資料平台、候選情境的市場驗證"],
    ["範圍外（另案）", "冷鏈車隊既有設備整合、認證代辦、長期代銷"],
    ["Decision Rights", "貴公司：產品、預算與最終商業決定｜ISTI：研究、證據整合與閘門建議｜技術專家：技術邊界確認"],
    ["殺案條件", "簽約 30 日內未完成窗口指定與 3 位客戶訪談承諾，範圍縮小；60 日內仍未達成即終止。"]
  ];
  var SETUP_CHECKS = ["決策問題寫的是我們真正要做的決定", "範圍內與範圍外的劃分正確", "各方責任分工可以接受", "我們理解並同意殺案條件"];
  var SELF = [
    ["g1", "貴公司是否需要在一定期限內做出市場或產品決策？", ["有明確期限與負責人", "有方向但沒有期限", "還在探索"]],
    ["g2", "產品目前的成熟度？", ["已有可交付產品或 PoC", "有原型，尚未驗證", "仍在概念階段"]],
    ["g3", "相對競品或現行做法，有沒有可被證明的優勢？", ["有數據或客戶回饋支持", "有，但還沒驗證", "不確定"]],
    ["g4", "能否指定窗口，並提供資料與客戶接觸？", ["可以，且有決策人參與", "可以提供部分", "暫時無法"]],
    ["g5", "能否定義 90 天內看得到的驗證指標？", ["可以", "需要協助定義", "很難"]],
    ["g6", "希望 ISTI 在哪方面加值？", ["市場與技術都需要", "只需要市場研究", "還不確定"]]
  ];
  var MATERIALS = [
    ["spec", "技術規格與限制說明", "用來建立技術基準（Technology Baseline）"],
    ["poc", "既有 PoC 或試用報告", "判斷哪些情境已有一手證據"],
    ["customers", "現有與潛在客戶名單", "安排外部訪談，目標 5–10 次"],
    ["winloss", "過去成交與失敗案例", "了解客戶為何買或不買"],
    ["roadmap", "產品路線圖", "區分現在能交付與未來才有的功能"]
  ];
  var BASELINE = [
    ["量測範圍", "−40 至 85°C（示意）"],
    ["電池壽命", "約 2 年，每 10 分鐘上傳一次（示意）"],
    ["傳輸方式", "低功耗廣域網路，需當地網路覆蓋（示意）"],
    ["既有證據", "2 場 PoC，皆於台灣冷藏倉儲（示意）"]
  ];
  var SCENARIOS = [
    ["s1", "疫苗冷鏈運輸", "需要逐箱溫度紀錄與稽核軌跡，可能放大低功耗與長效優勢。"],
    ["s2", "生鮮電商最後一哩配送", "量大、單價低，對標籤成本敏感。"],
    ["s3", "醫院藥庫監測", "固定場域、網路穩定，但採購流程長。"],
    ["s4", "半導體化學品運輸", "溫控要求嚴格，可能需要更高精度或認證。"],
    ["s5", "研究實驗室樣本保存", "部分樣本需超低溫，可能超出量測範圍。"]
  ];
  var FEED = [
    ["2026-10-02", "第 2 週週報", "完成技術基準 V1，提出 5 個候選情境，請貴公司技術方在 10/9 前完成校準。"],
    ["2026-09-30", "案件閘門：Conditional Pass", "可以開始，但須於 10/15 前補齊客戶訪談名單（G-4）與 PoC 報告。"],
    ["2026-09-25", "段 0 訪談完成", "已整理專案設定備忘錄，請確認決策問題、範圍與殺案條件。"]
  ];

  var state;
  function load() { try { var s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) return Object.assign(JSON.parse(JSON.stringify(SEED)), s); } catch (e) {} return JSON.parse(JSON.stringify(SEED)); }
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  state = load();

  var $ = function (s) { return document.querySelector(s); };
  function h(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "text") n.textContent = v;
      else if (k === "class") n.className = v;
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), v);
      else if (k === "checked" || k === "value" || k === "disabled") n[k] = v;
      else n.setAttribute(k, v);
    }
    (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function flash(el) { el.textContent = "已儲存"; setTimeout(function () { el.textContent = ""; }, 2000); }

  /* ---------- Track ---------- */
  function renderTrack() {
    var t = $("#track"); t.innerHTML = ""; var idx = 0;
    STAGES.forEach(function (s) {
      if (s === "G1" || s === "G2") {
        var passed = s === "G1" ? !!state.gate1 && state.gate1 !== "Defer" : false;
        t.appendChild(h("div", { class: "g" + (passed ? " passed" : ""), title: s === "G1" ? "案件閘門" + (state.gate1 ? "：" + state.gate1 : "") : "決策關卡：尚未裁決" }, [h("i")]));
        return;
      }
      var cls = idx < state.stageIndex ? "seg done" : idx === state.stageIndex ? "seg now" : "seg";
      t.appendChild(h("div", { class: cls, "aria-current": idx === state.stageIndex ? "step" : null }, [s[0] + " " + s[1]]));
      idx++;
    });
  }

  /* ---------- Todos (derived from state) ---------- */
  function todos() {
    var list = [];
    list.push({ tab: "setup", t: "確認專案設定備忘錄", d: "決策問題、範圍與殺案條件", done: state.setupConfirmed });
    var c = state.contact; list.push({ tab: "commit", t: "指定窗口與決策人", d: "案件閘門 G-4 的條件", done: !!(c.name && c.email && c.decider) });
    list.push({ tab: "commit", t: "提供 3 位以上客戶訪談對象", d: "Conditional Pass 的補件條件，期限 10/15", done: state.interviews.length >= 3 });
    var pend = MATERIALS.filter(function (m) { return state.materials[m[0]] !== "provided"; }).length;
    list.push({ tab: "commit", t: "提供待補資料", d: pend ? "尚有 " + pend + " 項" : "全部完成", done: !pend });
    var cal = SCENARIOS.filter(function (s) { return (state.calib[s[0]] || {}).v; }).length;
    list.push({ tab: "calib", t: "技術方校準候選情境", d: "已完成 " + cal + " / " + SCENARIOS.length + "，期限 10/9", done: cal === SCENARIOS.length });
    return list;
  }

  /* ---------- Tabs ---------- */
  var TABS = [["home", "總覽"], ["check", "申請前自評"], ["setup", "專案設定確認"], ["commit", "我們的承諾"], ["calib", "技術—情境校準"], ["updates", "進度週報"], ["decision", "閘門結果"]];
  var tab = "home";
  try { var t0 = localStorage.getItem(KEY + "-tab"); if (t0) tab = t0; } catch (e) {}
  if (/^#[a-z]+$/.test(location.hash) && TABS.some(function (t) { return "#" + t[0] === location.hash; })) tab = location.hash.slice(1);
  function renderTabs() {
    var nav = $("#tabs"); nav.innerHTML = "";
    var open = todos().filter(function (x) { return !x.done; });
    TABS.forEach(function (t) {
      var n = open.filter(function (x) { return x.tab === t[0]; }).length;
